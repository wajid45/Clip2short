<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip2Short · Turn long streams into Shorts and Reels</title>
    <meta
      name="description"
      content="Paste a stream or video link. Clip2Short's AI finds the moments worth clipping, scores them, writes hooks and captions, and posts them to YouTube Shorts, Instagram and Facebook."
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clip2Short" />
    <meta property="og:title" content="Clip2Short · Turn long streams into Shorts and Reels" />
    <meta property="og:description" content="AI finds the clips hiding in your long videos, writes the hooks and captions, and posts them for you." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clip2Short: find the Shorts and Reels hiding in your long videos" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply the saved theme before first paint (no light/dark flash). "js" turns on the
      // entrance animations; the opening curtain plays once per browser session.
      document.documentElement.classList.add("js");
      try {
        if (sessionStorage.getItem("sl_intro")) document.documentElement.classList.add("intro-seen");
        else if (location.pathname === "/") sessionStorage.setItem("sl_intro", "1");
      } catch (e) {
        document.documentElement.classList.add("intro-seen");
      }
      try {
        var m = document.cookie.match(/(?:^|; )sl_theme=(light|dark)/);
        if (m) document.documentElement.setAttribute("data-theme", m[1]);
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
