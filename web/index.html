<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17181d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8fc" />
    <title>Clip2Short</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        var m = document.cookie.match(/(?:^|; )sl_theme=(light|dark)/);
        // The app opens on its white theme unless the user picked dark.
        document.documentElement.setAttribute("data-theme", m ? m[1] : "light");
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
