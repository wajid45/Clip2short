<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3" />
    <title>Shortlark</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        var m = document.cookie.match(/(?:^|; )sl_theme=(light|dark)/);
        if (m) document.documentElement.setAttribute("data-theme", m[1]);
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
